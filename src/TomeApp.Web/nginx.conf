server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/json;
    gzip_min_length 1024;

    # Serve Blazor WASM .br/.gz pre-compressed files
    location ~* \.(dll|wasm|dat|blat)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback – all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
